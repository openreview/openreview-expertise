# This workflow deploys the master branch to the live site

name: prod-deployment

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      version:
        description: "openreview-expertise Release Tag"
        required: true
        type: string
env:
  REPO: openreview-docker-images
  PROJECT: sunlit-realm-131518
  IMAGE_NAME: expertise-production
jobs:
  deploy:
    # Allow the job to fetch a GitHub ID token
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version }}
      - name: Free up space
        run: |
          # Remove .NET SDKs
          sudo rm -rf /usr/share/dotnet

          # Remove Android SDKs
          sudo rm -rf /usr/local/lib/android

          docker system prune -af || true
          docker builder prune -af || true
          df -h
      - name: Authenticate with Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          cleanup_credentials: true
          export_environment_variables: true
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Setup Docker authentication
        run: gcloud auth configure-docker us-docker.pkg.dev --quiet
      - name: Set Environment Variables
        run: |
          echo "IMAGE_TAG_VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          echo "IMAGE=${{ env.IMAGE_NAME }}" >> $GITHUB_ENV
          echo "IMAGE_TAG=us-docker.pkg.dev/${{ env.PROJECT }}/${{ env.REPO }}/${{ env.IMAGE_NAME }}" >> $GITHUB_ENV
      - name: Check if image exists
        id: image_check
        run: |
          IMAGE_PATH="${{ env.IMAGE_TAG }}:${{ env.IMAGE_TAG_VERSION }}"
          echo "Checking for image: ${IMAGE_PATH}"
          
          if docker manifest inspect "${IMAGE_PATH}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Docker Buildx
        if: steps.image_check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3
      - name: Build and push image
        if: steps.image_check.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Push multiple tags: the version provided
          tags: |
            ${{ env.IMAGE_TAG }}:${{ env.IMAGE_TAG_VERSION }}
          cache-from: type=registry,ref=${{ env.IMAGE_TAG }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_TAG }}:buildcache,mode=max
      - name: Run deploy scripts
        run: |
          gcloud config set compute/zone us-central1-b
          VERSION="${{ github.event.inputs.version }}"
          GCP_CONTAINER_IMAGE="${IMAGE_TAG}:${VERSION}"
          echo "Deploying version: $VERSION"
          gcloud compute ssh --tunnel-through-iap openreview@openreview-expertise-instance --command "export GCP_CONTAINER_IMAGE=${GCP_CONTAINER_IMAGE}; /bin/expertise_build.sh $VERSION \"${GCP_CONTAINER_IMAGE}\"" --quiet
